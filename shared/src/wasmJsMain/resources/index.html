<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infill</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4A6B3A">
<style>
  html, body { margin: 0; height: 100%; background: #121417; overflow: hidden; }
  canvas { touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #e8e6e1; font: 16px/1.5 system-ui, sans-serif; }
  @media (prefers-color-scheme: light) {
    html, body { background: #d8d2c4; }
    #loading { color: #22262b; }
  }
</style>
<script>
  // The language chosen in Settings, when there is one, answers for the browser's own,
  // since that's what the game's strings are looked up by.
  (function () {
    var own = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
    Object.defineProperty(Navigator.prototype, "languages", Object.assign({}, own, {
      get: function () { return window.__infillLanguage ? [window.__infillLanguage] : own.get.apply(this); }
    }));
  })();
</script>
<script src="infill.js" defer></script>
</head>
<body>
<div id="loading">Loading Infill…</div>
</body>
</html>
