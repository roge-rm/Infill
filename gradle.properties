# Gradle's own heap. ~/.gradle/gradle.properties can raise it for one machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Modules build side by side where they don't depend on each other, and a task
# whose inputs haven't changed takes its output from the build cache.
org.gradle.parallel=true
org.gradle.caching=true
# Skip the configuration phase when nothing that affects it has changed.
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true
kotlin.code.style=official
